[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "revenge-bench"
version = "0.1.1"
description = "RevengeBench: reverse-engineering code-space policies from behavioral experiments"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Babak Rahmani"},
    {name = "Sebastian Dziadzio"},
    {name = "Joschka Strüber"},
    {name = "Sergio Hernández-Gutiérrez"},
    {name = "Matthias Bethge"},
]
keywords = [
    "benchmark",
    "llm-agents",
    "programming-games",
    "reverse-engineering",
    "policy-recovery",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "litellm",
    "mini-swe-agent>=1.17.1,<2.0",
    "portkey-ai",
    "python-dotenv",
    "ghapi",
    "flask",
    "jinja2",
    "markupsafe",
    "unidiff",
    "trueskill",
    "cdifflib",
    "zstandard>=0.25.0",
    "beautifulsoup4>=4.14.3",
    "requests",
    "tqdm",
    "mcp>=1.27.0",
    "scipy",
]

[project.optional-dependencies]
dev = [
    "pre-commit",
    "pytest",
    "pytest-cov",
    "pytest-xdist",
    "ruff",
    "Werkzeug",
    "frozen-flask",
]
aws = ["boto3"]

[project.urls]
Homepage = "https://revengebench.com"
Repository = "https://github.com/bethgelab/revenge-bench"
Paper = "https://arxiv.org/abs/2606.26094"
Dataset = "https://huggingface.co/datasets/bethgelab/revengebench"
Issues = "https://github.com/bethgelab/revenge-bench/issues"

[project.scripts]
revenge-bench = "revenge_bench.cli:main_cli"
revenge-bench-pool-eval = "revenge_bench.scripts.run_pool_eval:main"

[tool.setuptools.packages.find]
where = ["src", "vendor/codeclash"]
include = ["revenge_bench*", "codeclash*"]

[tool.setuptools.package-data]
revenge_bench = [
    "arenas/**/*.Dockerfile",
    "arenas/**/*.def",
    "arenas/**/*.js",
    "arenas/**/main_seed.py",
    "harbor/prompts/**/*.yaml",
    "harbor/traces/parsers/*.js",
    "traces/parsers/*.js",
    "assets/configs/**/*",
    "assets/data/**/*",
    "assets/scripts/**/*",
]
codeclash = [
    "arenas/**/*.Dockerfile",
    "analysis/**/*.yaml",
    "viewer/static/**/*",
    "viewer/templates/**/*",
]

[tool.pytest.ini_options]
addopts = "-m 'not slow'"
norecursedirs = ["data", ".venv", "node_modules", "vendor/codeclash"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "vendor/codeclash",
    "data",
    "logs",
    "site",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
