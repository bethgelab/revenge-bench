# NL Observation Condition: HuskyBench — GPT-5.4-mini
#
# Top 15 targets by ELO rank, 5 rounds, step_limit=30, cost_limit=$1
# Learner receives natural language behavioral summaries instead of raw traces.
# No probing. Summarizer: GPT-5.4-mini.

name: gpt54_mini_nl_observation

strategy_pool:
  pool_dir: data/inverse/targets/huskybench
  opponent_pool_dir: data/inverse/targets/huskybench
  fixed_target: false
  seed: 42
  top_elo_targets: 15

tournament:
  rounds: 5
  type: interventionist
  max_probes_per_round: 0
  sims_per_probe: 50
  opponents_per_round: 20
  observation_mode: nl_summary
  summarizer_model:
    model_name: openai/gpt-5.4-mini
    api_base: http://localhost:8000/v1
    api_key: dummy

game:
  name: HuskyBench
  sims_per_round: 400
  args:
    browser: false

players:
  - agent: inverse
    name: learner
    editable: true
    config:
      agent:
        <<: !include inverse/prompts/system/interventionist_nl_observation.yaml
        step_limit: 30
        cost_limit: 1.0
        max_output_chars: 3000
        keep_recent_observations: 8
        max_past_output_chars: 500
        max_context_chars: 100000
      model:
        model_name: openai/gpt-5.4-mini
        cost_tracking: ignore_errors
        model_kwargs:
          api_base: http://localhost:8000/v1
          api_key: dummy

  - agent: static
    name: target
    editable: false
    args:
      source_path: data/inverse/targets/huskybench  # overridden by pool

  - agent: static
    name: opponent
    editable: false
    args:
      source_path: data/inverse/targets/huskybench  # overridden per-round by pool

prompts:
  <<: !include inverse/prompts/game/nl_observation/huskybench.yaml
