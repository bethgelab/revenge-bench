# Full Pool Benchmark: Halite — GLM 5.1
#
# Top 15 targets by ELO rank, 5 rounds, step_limit=30, cost_limit=$1
# Truncation: max_output_chars=3000, keep_recent_observations=8, max_past_output_chars=500, max_context_chars=100000

name: glm_5_1_full_pool

strategy_pool:
  pool_dir: data/inverse/targets/halite
  opponent_pool_dir: data/inverse/targets/halite
  fixed_target: false
  seed: 42
  top_elo_targets: 15

tournament:
  seed: 42
  rounds: 5
  type: interventionist
  max_probes_per_round: 5
  sims_per_probe: 3
  opponents_per_round: 20

game:
  name: Halite
  sims_per_round: 20
  args: {}

players:
  - agent: inverse
    name: learner
    editable: true
    config:
      agent:
        <<: !include inverse/prompts/system/interventionist.yaml
        step_limit: 30
        cost_limit: 1.0
        max_output_chars: 3000
        keep_recent_observations: 8
        max_past_output_chars: 500
        max_context_chars: 100000
      model:
        model_name: openrouter/z-ai/glm-5.1
        cost_tracking: ignore_errors
        model_kwargs:
          timeout: 300
          num_retries: 3
          extra_body:
            provider:
              order: ["DeepInfra", "AtlasCloud", "SiliconFlow", "Z.AI"]
              allow_fallbacks: true
  - agent: static
    name: target
    editable: false
    args:
      source_path: data/inverse/targets/halite  # overridden by pool

  - agent: static
    name: opponent
    editable: false
    args:
      source_path: data/inverse/targets/halite  # overridden per-round by pool

prompts:
  <<: !include inverse/prompts/game/halite.yaml
