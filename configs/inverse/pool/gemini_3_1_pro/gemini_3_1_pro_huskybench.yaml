# Full Pool Benchmark: HuskyBench — Gemini 3.1 Pro
#
# Top 15 targets by ELO rank, 5 rounds, step_limit=30, cost_limit=$1
# Truncation: max_output_chars=3000, keep_recent_observations=8, max_past_output_chars=500, max_context_chars=100000

name: gemini_3_1_pro_full_pool

strategy_pool:
  pool_dir: data/inverse/targets/huskybench
  opponent_pool_dir: data/inverse/targets/huskybench
  fixed_target: false
  seed: 42
  top_elo_targets: 15

tournament:
  seed: 42
  rounds: 5
  type: interventionist
  max_probes_per_round: 5
  sims_per_probe: 50
  opponents_per_round: 20

game:
  name: HuskyBench
  sims_per_round: 400
  args:
    browser: false

players:
  - agent: inverse
    name: learner
    editable: true
    config:
      agent:
        <<: !include inverse/prompts/system/interventionist.yaml
        step_limit: 30
        cost_limit: 1.0
        max_output_chars: 3000
        keep_recent_observations: 8
        max_past_output_chars: 500
        max_context_chars: 100000
      model:
        model_name: openrouter/google/gemini-3.1-pro-preview
        cost_tracking: ignore_errors
        model_kwargs:
          timeout: 300
          num_retries: 3
          extra_body:
            provider:
              order: ["Google AI Studio", "Google"]
              allow_fallbacks: true
  - agent: static
    name: target
    editable: false
    args:
      source_path: data/inverse/targets/huskybench  # overridden by pool

  - agent: static
    name: opponent
    editable: false
    args:
      source_path: data/inverse/targets/huskybench  # overridden per-round by pool

prompts:
  <<: !include inverse/prompts/game/huskybench.yaml
