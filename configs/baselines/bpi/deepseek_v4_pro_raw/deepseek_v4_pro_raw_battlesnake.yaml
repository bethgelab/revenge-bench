# Bayesian Program Inference (BPI / ROTE) — raw mode: BattleSnake — DeepSeek v4 Pro

name: deepseek_v4_pro_raw_bayesian_inference

strategy_pool:
  pool_dir: data/targets/battlesnake
  opponent_pool_dir: data/targets/battlesnake
  fixed_target: false
  seed: 42
  top_elo_targets: 15

tournament:
  type: bayesian_program_inference
  rounds: 1
  num_candidates: 5
  beta: 10.0
  alpha: 0.01
  diversity:
    bootstrap_observations: true
    diverse_prompts:
      - "Focus on the simplest possible rules: what does the target ALWAYS do regardless of game state? Implement the minimal set of if-then rules that cover the most common cases."
      - "Focus on spatial/positional reasoning: how does the target use distance, direction, and relative position to make decisions? Look for geometric patterns."
      - "Focus on state-dependent branching: identify distinct modes the target operates in (offensive/defensive/neutral) and what triggers transitions between them."
      - "Focus on opponent-reactive behavior: how does the target respond to what the opponent is doing? Look for chase/flee/mirror patterns that depend on opponent state."
      - "Focus on resource/value optimization: what does the target prioritize collecting or maximizing? Look for greedy heuristics, scoring functions, and utility-based decisions."
  opponents_per_round: 20
  observation_mode: raw

game:
  name: BattleSnake
  sims_per_round: 20
  args:
    width: 11
    height: 11
    browser: false

players:
  - agent: inverse
    name: learner
    editable: true
    config:
      agent:
        <<: !include prompts/system/interventionist.yaml
        step_limit: 30
        cost_limit: 1.0
        max_output_chars: 3000
        keep_recent_observations: 8
        max_past_output_chars: 500
        max_context_chars: 100000
      model:
        model_name: openrouter/deepseek/deepseek-v4-pro
        cost_tracking: ignore_errors
        model_kwargs:
          timeout: 300
          num_retries: 3
          extra_body:
            provider:
              only: ["DeepSeek"]
  - agent: static
    name: target
    editable: false
    args:
      source_path: data/targets/battlesnake

  - agent: static
    name: opponent
    editable: false
    args:
      source_path: data/targets/battlesnake

prompts:
  <<: !include prompts/game/no_probe/battlesnake.yaml
