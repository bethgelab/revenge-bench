        } else if (ady > adx) {
          // Prefer vertical when |dy| > |dx|
          primary = dy > 0 ? Direction.South : Direction.North;
          secondary = dx > 0 ? Direction.East : Direction.West;
        } else {
          // Equal |dx| == |dy|:
          // Prefer vertical if dx > 0; prefer horizontal if dx < 0
          if (dx > 0) {
            primary = dy > 0 ? Direction.South : Direction.North;      // vertical
            secondary = dx > 0 ? Direction.East : Direction.West;      // horizontal
          } else {
            primary = dx > 0 ? Direction.East : Direction.West;        // horizontal
            secondary = dy > 0 ? Direction.South : Direction.North;    // vertical
          }
        }

        if (isFree(primary)) {
          return Action.move(primary);
        } else if (isFree(secondary)) {
          return Action.move(secondary);
        } else {
          // Try perpendicular rotations around primary as tertiary options (CW preferred)
          const cw = primary.rotateCw;
          if (isFree(cw)) return Action.move(cw);
          const ccw = primary.rotateCcw;
          if (isFree(ccw)) return Action.move(ccw);
          // If all appear blocked, still issue the primary move (engine may resolve)
          return Action.move(primary);
