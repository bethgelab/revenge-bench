      // Helper to test if moving in a direction leads to an unoccupied tile
      function isFree(direction) {
        const nx = unit.coords.x + direction.toCoords.x;
        const ny = unit.coords.y + direction.toCoords.y;
        const obj = state.objByCoords(new Coords(nx, ny));
