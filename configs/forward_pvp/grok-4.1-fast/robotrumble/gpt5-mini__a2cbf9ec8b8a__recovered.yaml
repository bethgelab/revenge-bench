      const adx = Math.abs(dx);
      const ady = Math.abs(dy);

      // Attack if adjacent
      if (adx + ady === 1) {
        if (dx === 1) return Action.attack(Direction.East);
        if (dx === -1) return Action.attack(Direction.West);
        if (dy === 1) return Action.attack(Direction.South);
        if (dy === -1) return Action.attack(Direction.North);
