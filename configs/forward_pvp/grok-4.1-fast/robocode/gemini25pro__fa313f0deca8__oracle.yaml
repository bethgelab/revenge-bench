tournament:
  rounds: 5
game:
  name: RoboCode
  sims_per_round: 30
  record_ratio: 1.0
  args:
    nodisplay: true
    nosound: true
players:
- agent: static
  name: target
  editable: false
  args:
    source_path: data/inverse/targets/robocode/gemini25pro__fa313f0deca8
- agent: mini
  name: challenger
  config:
    agent: !include mini/default.yaml
    model:
      model_name: openai/grok-4.1-fast
      cost_tracking: ignore_errors
      model_kwargs:
        api_base: http://localhost:8000/v1
        api_key: dummy
prompts:
  game_description: |-
    You are a software developer ({{player_id}}) competing in a coding game called RoboCode.
    Robocode (Tank Royale) is a programming game where your code is the tank: each turn your bot sends intents — speed plus body/gun/radar turn rates and firepower — based on the game state it perceives via radar.
    Your program decides how to move, aim, and fire in a deterministic, turn-based arena to outlast other bots.
    Your bot logic must be written in Java and located in the `robots/custom/` directory.
    Keep the main bot class named `MyTank.java`, but you can include additional Java files if you'd like.

    The game is played in 5 rounds. For every round, you (and your competitors) edit program code that controls your bot. This is round {{round}}.
    After you and your competitor finish editing your codebases, the game is run automatically.

    Your goal is to defeat your opponent. Anticipate their strategy and build a bot that counters it.
    Your bot is in `robots/custom/`, located in {{working_dir}}.
    {{working_dir}} is your codebase, which contains both your bot and supporting assets.
    All of your commands will be executed in the {{working_dir}} directory (see notes below).

    ## Opponent Intelligence

    You have obtained your opponent's strategy code:

    ```java
    package custom;

    import robocode.*;
    import robocode.util.Utils;
    import java.awt.Color;

    public class MyTank extends AdvancedRobot {
        boolean movingForward;

        public void run() {
            setAdjustGunForRobotTurn(true);
            setAdjustRadarForGunTurn(true);
            setBodyColor(Color.red);
            setGunColor(Color.black);
            setRadarColor(Color.yellow);
            setBulletColor(Color.green);
            setScanColor(Color.green);
            movingForward = true;

            setTurnRadarRight(Double.POSITIVE_INFINITY);

            while (true) {
                execute();
            }
        }

        public void onScannedRobot(ScannedRobotEvent e) {
            double radarTurn = getHeading() - getRadarHeading() + e.getBearing();
            setTurnRadarRight(Utils.normalRelativeAngleDegrees(radarTurn) * 1.2);

            double absoluteBearing = getHeading() + e.getBearing();
            double bearingFromGun = Utils.normalRelativeAngleDegrees(absoluteBearing - getGunHeading());

            setTurnGunRight(bearingFromGun);

            if (Math.abs(bearingFromGun) <= 3 && getGunHeat() == 0) {
                double firePower = Math.min(400 / e.getDistance(), 3);
                fire(firePower);
            }

            if (movingForward) {
                setAhead(100);
            } else {
                setBack(100);
            }
            setTurnRight(e.getBearing() + 90);
        }

        public void reverseDirection() {
            movingForward = !movingForward;
        }

        public void onHitWall(HitWallEvent e) {
            reverseDirection();
        }

        public void onHitRobot(HitRobotEvent e) {
            if (e.isMyFault()) {
                reverseDirection();
            }
        }
    }
    ```

    Use this intelligence to inform your strategy. A well-designed bot that accounts for the opponent's tendencies will outperform a fragile exploit. Focus on writing robust, well-tested code first, then incorporate any insights from the opponent's logic as refinements.
