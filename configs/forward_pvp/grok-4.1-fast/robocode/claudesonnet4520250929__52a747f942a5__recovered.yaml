    You have obtained your opponent's strategy code:

    ```python
    """Recovered strategy approximation for RoboCode target.

    Key inferred rules from analyses and probes (round 3):
    - Velocity: output equals current my_velocity (best match across traces).
    - Body: turn_body = 0.0 most of the time (best fit vs enemy-clamped turning).
    - Gun: aim directly at enemy — turn_gun = clamp(gun_offset, -20, 20).
    - Radar:
      * If enemy present: turn_radar = clamp(2 * radar_offset, -45, 45) for radar lock.
      * If enemy data missing (enemy_distance==0 and enemy_energy==0): spin radar at +45.
    - Firing: only when gun is cool and gun is tightly aligned; modest power by distance.

    Important geometry: headings are degrees, clockwise from North. The recorded turn_gun and
    turn_radar are TOTAL deltas and already include coupling from body/gun, so we compute offsets
    from absolute bearings to the enemy.
    """
    import math


    def _clamp(x, lo, hi):
        return max(lo, min(hi, x))


    def _normalize_angle(deg):
        """Normalize angle to [-180, 180) degrees."""
        return (deg + 180) % 360 - 180


    def _abs_bearing_to_enemy(state):
        """Compute absolute bearing (degrees, clockwise from North) from my pos to enemy."""
        dx = state["enemy_x"] - state["my_x"]
        dy = state["enemy_y"] - state["my_y"]
        return math.degrees(math.atan2(dx, dy)) % 360


    def move(state):
        # Detect when enemy data is missing in trace (placeholders are zeros)
        enemy_present = not (
            state.get("enemy_distance", 0.0) == 0.0 and state.get("enemy_energy", 0.0) == 0.0
        )

        # Velocity: best match is to echo current speed
        velocity = _clamp(state.get("my_velocity", 0.0), -8.0, 8.0)

        # Default outputs
        turn_body = 0.0
        turn_gun = 0.0
        turn_radar = 0.0
        fire_power = 0.0

        if not enemy_present:
            # When no enemy data, target typically holds body/gun and spins radar at +45
            turn_body = 0.0
            turn_gun = 0.0
            turn_radar = 45.0
            fire_power = 0.0
        else:
            # Compute bearings and offsets
            abs_bearing = _abs_bearing_to_enemy(state)
            gun_offset = _normalize_angle(abs_bearing - state.get("my_gun_heading", 0.0))
            radar_offset = _normalize_angle(abs_bearing - state.get("my_radar_heading", 0.0))

            # Body: stays at 0 (observed strongest signal)
            turn_body = 0.0

            # Gun: aim directly at enemy with clamp
            turn_gun = _clamp(gun_offset, -20.0, 20.0)

            # Radar: 2x lock pattern
            turn_radar = _clamp(2.0 * radar_offset, -45.0, 45.0)

            # Fire: only when cool and tightly aligned to enemy
            gun_heat = state.get("my_gun_heat", 1.0)
            if gun_heat <= 0.0 and abs(gun_offset) <= 2.0:
                # Modest power by distance
                distance = state.get("enemy_distance", 1e9)
                if distance < 200.0:
                    fire_power = 2.0
                elif distance < 350.0:
                    fire_power = 1.5
                else:
                    fire_power = 1.0
            else:
                fire_power = 0.0

        return {
            "velocity": _clamp(velocity, -8.0, 8.0),
            "turn_body": _clamp(turn_body, -10.0, 10.0),
            "turn_gun": _clamp(turn_gun, -20.0, 20.0),
            "turn_radar": _clamp(turn_radar, -45.0, 45.0),
            "fire_power": _clamp(fire_power, 0.0, 3.0),
        }

    ```

