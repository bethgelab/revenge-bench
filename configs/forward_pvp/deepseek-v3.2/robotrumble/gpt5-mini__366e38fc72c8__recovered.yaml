    You are a software developer ({{player_id}}) competing in a coding game called RobotRumble.
    RobotRumble is a turn-based coding battle where you program a team of robots to move, attack, and outmaneuver your opponent on a 19x19 grid.
    Each player controls a team of Soldier units (Blue vs Red). Each unit independently executes your function, choosing to Move or Attack in a cardinal direction. The game lasts up to 100 turns.
    Every decision is driven by your code, and victory comes from crafting logic that positions robots smartly, times attacks well, and adapts over the match.
    NOTE: Please ensure that your code runs efficiently (under 60 seconds). Code that exceeds this run time will automatically forfeit the round.
    Your bot is a JavaScript file `robot.js` at the top level of your workspace.

    The game is played in 5 rounds. For every round, you (and your competitors) edit program code that controls your robot team. This is round {{round}}.
    After you and your competitor finish editing your codebases, the game is run automatically.

    Your goal is to defeat your opponent. Anticipate their strategy and build a bot that counters it.
    Your bot is `robot.js`, located in {{working_dir}}.
    {{working_dir}} is your codebase, which contains both your bot and supporting assets.
    All of your commands will be executed in the {{working_dir}} directory (see notes below).

    ## Opponent Intelligence

    You have obtained your opponent's strategy code:

    ```javascript
    function robot(state, unit) {
      const enemies = state.objsByTeam(state.otherTeam);
      if (!enemies || enemies.length === 0) {
        // Deterministic default if no enemies are present
        return Action.move(Direction.East);
      }

      const closestEnemy = _.minBy(enemies, e => unit.coords.distanceTo(e.coords));
      const dist = unit.coords.distanceTo(closestEnemy.coords);
      const dir = unit.coords.directionTo(closestEnemy.coords);

      // Attack if adjacent
      if (dist === 1) {
        return Action.attack(dir);
      }

      // Helper to check if a move direction is free (no unit or wall)
      function isFree(moveDir) {
        const nx = unit.coords.x + moveDir.toCoords.x;
        const ny = unit.coords.y + moveDir.toCoords.y;
        return !state.objByCoords(new Coords(nx, ny));
      }

      // Prefer moving toward the closest enemy; if blocked, try CW then CCW fallback
      if (isFree(dir)) {
        return Action.move(dir);
      }
      const cw = dir.rotateCw;
      if (isFree(cw)) {
        return Action.move(cw);
      }
      const ccw = dir.rotateCcw;
      if (isFree(ccw)) {
        return Action.move(ccw);
      }

      // If all are blocked, stick with original desired direction
      return Action.move(dir);
    }

    ```

    Use this intelligence to inform your strategy. A well-designed bot that accounts for the opponent's tendencies will outperform a fragile exploit. Focus on writing robust, well-tested code first, then incorporate any insights from the opponent's logic as refinements.
