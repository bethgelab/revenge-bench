    static int dx_for_dir(int dir) {
        switch (dir) {
            case NORTH: return 0;
            case EAST:  return 1;
            case SOUTH: return 0;
            case WEST:  return -1;
            default:    return 0;
        }
    }
    static int dy_for_dir(int dir) {
        switch (dir) {
            case NORTH: return -1;
            case EAST:  return 0;
            case SOUTH: return 1;
            case WEST:  return 0;
            default:    return 0;
        }
    }
    static inline int wrap_x(int x, int w) {
        if (x < 0) x += ((-x) / w + 1) * w;
        return x % w;
    }
    static inline int wrap_y(int y, int h) {
        if (y < 0) y += ((-y) / h + 1) * h;
        return y % h;
    }

    // Find production at the nearest non-owned tile along a given cardinal direction.
    static int nearest_border_production(GAME game, int x, int y, int dir, int my_id) {
        int w = game.width, h = game.height;
        int cx = x, cy = y;
        int maxd = (w > h ? w : h);
        for (int d = 1; d <= maxd; d++) {
            cx = wrap_x(cx + dx_for_dir(dir), w);
            cy = wrap_y(cy + dy_for_dir(dir), h);
            int owner = game.owner[cx][cy];
            if (owner != my_id) {
                return game.production[cx][cy];
            }
        }
        return -1; // no border found (unlikely)
    }

    static int choose_direction(GAME game, int x, int y) {
