        // Additional rule: on zero-production tiles, wait until some absolute strength
        if (my_prod == 0 && my_strength < 20) {
            return STILL;
        }

        // If adjacent non-owned tiles are weaker, attack the one with the highest production.
        int best_dir = STILL;
        int best_prod = -1;
        int dirs[4] = {NORTH, EAST, SOUTH, WEST};
        for (int i = 0; i < 4; i++) {
            int dir = dirs[i];
            SITE n = GetSiteFromMovement(game, x, y, dir);
            if (n.owner != my_id && my_strength > n.strength) {
                if (n.production > best_prod) {
                    best_prod = n.production;
                    best_dir = dir;
                }
            }
        }
        if (best_dir != STILL) return best_dir;

        // Otherwise, move toward the direction whose nearest non-owned tile has the highest production.
        int best_score = -1000000000;
        best_dir = STILL;
        for (int i = 0; i < 4; i++) {
            int dir = dirs[i];
            int prod_ray = nearest_border_production(game, x, y, dir, my_id);
            if (prod_ray > best_score) {
                best_score = prod_ray;
                best_dir = dir;
            }
        }
        if (best_dir == STILL) return STILL;
           SITE n2 = GetSiteFromMovement(game, x, y, best_dir);
            if (n2.owner != my_id && n2.strength >= my_strength) {
                return STILL;
            }
        return best_dir;
    }

    int main(void) {
        GAME game;
        int x, y, direction;

        // Deterministic behavior helpful for matching and debugging
        srand(0);

        game = GetInit();
        SendInit(BOT_NAME);

        while (1) {
            GetFrame(game);

            for (x = 0 ; x < game.width ; x++) {
                for (y = 0 ; y < game.height ; y++) {
                    if (game.owner[x][y] == game.playertag) {
                        direction = choose_direction(game, x, y);
                        SetMove(game, x, y, direction);
                    }
                }
            }

            SendFrame(game);
        }

        return 0;
    }

