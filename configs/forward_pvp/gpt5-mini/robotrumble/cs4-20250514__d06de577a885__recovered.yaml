    ## Opponent Intelligence

    You have obtained your opponent's strategy code:

    ```javascript
    function robot(state, unit) {
      // Select enemies as the opposite team
      const enemies = state.objsByTeam(state.otherTeam) || [];
      if (enemies.length === 0) {
        // If no enemies are present, do nothing
        return null;
      }

      // Find the closest enemy by Euclidean distance
      let closestEnemy = enemies[0];
      let closestDist = unit.coords.distanceTo(closestEnemy.coords);
      for (let i = 1; i < enemies.length; i++) {
        const d = unit.coords.distanceTo(enemies[i].coords);
        if (d < closestDist) {
          closestDist = d;
          closestEnemy = enemies[i];
        }
      }

      // Determine direction toward the closest enemy
      const direction = unit.coords.directionTo(closestEnemy.coords);

      // Attack if adjacent (distance exactly 1), otherwise move toward them
      if (unit.coords.distanceTo(closestEnemy.coords) === 1) {
        return Action.attack(direction);
      } else {
        return Action.move(direction);
      }
    }

    ```

    Use this intelligence to inform your strategy. A well-designed bot that accounts for the opponent's tendencies will outperform a fragile exploit. Focus on writing robust, well-tested code first, then incorporate any insights from the opponent's logic as refinements.
