    Your goal is to defeat your opponent. Anticipate their strategy and build a bot that counters it.
    Your bot is in `robots/custom/`, located in {{working_dir}}.
    {{working_dir}} is your codebase, which contains both your bot and supporting assets.
    All of your commands will be executed in the {{working_dir}} directory (see notes below).

    ## Opponent Intelligence

    You have obtained your opponent's strategy code:

    ```python
    def _clamp(x, lo, hi):
        return max(lo, min(hi, x))


    def move(state):
        mv = state.get('my_velocity', 0.0) or 0.0

        # Velocity rule: set to nearest integer speed (clamped in return)
        # This matched target better in analysis than prior coarse tiers.
        velocity = round(float(mv))

        # Body turn: spin when moving fast forward; hold otherwise
        if mv >= 7.5:
            turn_body = 4.0
        else:
            turn_body = 0.0

        # Keep gun stable relative to battlefield (matches frequent 0.0)
        turn_gun = 0.0

        # Radar behavior depends on enemy presence and velocity regime
        enemy_distance = state.get("enemy_distance", 0.0) or 0.0
        if enemy_distance <= 0.0:
            # No enemy detected: sweep unless fast forward
            if mv >= 7.5:
                turn_radar = -4.0
            else:
                # At stop or medium speeds, sweep at +45
                turn_radar = 45.0
        else:
            # Enemy detected: lock radar by canceling body turn
            turn_radar = -turn_body

        fire_power = 0.0

        return {
            "velocity": _clamp(float(velocity), -8.0, 8.0),
            "turn_body": _clamp(turn_body, -10.0, 10.0),
            "turn_gun": _clamp(turn_gun, -20.0, 20.0),
            "turn_radar": _clamp(turn_radar, -45.0, 45.0),
            "fire_power": _clamp(fire_power, 0.0, 3.0),
        }

    ```

    Use this intelligence to inform your strategy. A well-designed bot that accounts for the opponent's tendencies will outperform a fragile exploit. Focus on writing robust, well-tested code first, then incorporate any insights from the opponent's logic as refinements.
