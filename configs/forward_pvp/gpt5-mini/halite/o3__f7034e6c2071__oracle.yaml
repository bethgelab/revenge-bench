# Game: Halite, OOD distance: 0.2282, best round: 4
# Model: openai/gpt-5-mini
#
# Player 1 (target): static agent, original code
# Player 2 (challenger): gpt-5-mini, oracle condition

tournament:
  rounds: 5
game:
  name: Halite
  sims_per_round: 30
  record_ratio: 1.0
players:
- agent: static
  name: target
  editable: false
  args:
    source_path: data/targets/halite/o3__f7034e6c2071
- agent: mini
  name: challenger
  config:
    agent: !include mini/default.yaml
    model:
      model_name: openai/gpt-5-mini
      cost_tracking: ignore_errors
      model_kwargs:
        api_base: http://localhost:8000/v1
        api_key: dummy
prompts:
  game_description: |-
    You are a software developer ({{player_id}}) competing in a coding game called Halite.
    Halite is a multi-player turn-based strategy game where bots compete on a rectangular grid to capture territory and accumulate strength.
    Players control pieces that can move across the map to conquer neutral and enemy territory, with each cell providing production that increases the strength of pieces occupying it.
    The goal is to control the most territory by the end of the game through strategic expansion, consolidation of forces, and tactical combat decisions.

    You have the choice of writing your Halite bot in one of four programming languages: C, C++, OCaml, or Rust.
    Example implementations can be found under the `airesources/` folder.
    Your submission should be stored in the `submission/` folder. This folder currently contains an example C bot, but feel free to use any of the supported languages.
    Please make sure your main file is named `main.<ext>`, where `<ext>` is the appropriate file extension for your chosen programming language.
    You may include additional files as needed, but please ensure:
    1. The `submission/` folder contains only files relevant to your bot.
    2. The `submission/` folder ONLY contains a single bot (no multiple bots in one submission).
    3. Your bot can be compiled. See `runGame.sh` under the corresponding `submission/<language>/` folder to see how we will compile and run your bot.

    The game is played in 5 rounds. For every round, you (and your competitors) edit program code that controls your bot. This is round {{round}}.
    After you and your competitor finish editing your codebases, the game is run automatically.

    Your goal is to defeat your opponent. Anticipate their strategy and build a bot that counters it.
    Your bot is in `submission/`, located in {{working_dir}}.
    {{working_dir}} is your codebase, which contains both your bot and supporting assets.
    All of your commands will be executed in the {{working_dir}} directory (see notes below).

    ## Opponent Intelligence

    You have obtained your opponent's strategy code:

    ```c
    #include <stdio.h>
    #include <stdlib.h>
    #include <time.h>
    #include "hlt.h"

    #define BOT_NAME "HeuristicCBot"

    /*
     Strategy:
     1. If strength < 5*production (or 20 when production is 0) -> stay STILL to build.
     2. Otherwise, look for adjacent enemy/neutral site with lower strength:
          score = production*5 - strength
          pick highest-score neighbour, then attack if (score > 0) or (our strength > 200).
     3. If no adjacent capture, move toward nearest border (closest non-owned site in each
        cardinal direction) provided our strength  2*build_threshold; else stay STILL.
     4. Prevent strength overflow on friendly stacking.
    */

    int main(void) {
        GAME game;
        int x, y;

        game = GetInit();
        SendInit(BOT_NAME);

        while (1) {
            GetFrame(game);
            int search_limit =
                (game.width > game.height ? game.width : game.height) / 2;

            for (x = 0; x < game.width; x++) {
                for (y = 0; y < game.height; y++) {
                    if (game.owner[x][y] != game.playertag)
                        continue;

                    SITE site = GetSiteFromXY(game, x, y);
                    int build_threshold =
                        (site.production == 0 ? 20 : site.production * 5);
                    int direction = STILL;

                    /* Rule 1: build strength */
                    if (site.production > 0 && site.strength < build_threshold) {
                        direction = STILL;
                    } else {
                        /* Rule 2: try adjacent capture */
                        int dirs[4] = {NORTH, EAST, SOUTH, WEST};
                        int best_score = -10000;
                        int best_dir = STILL;
                        for (int i = 0; i < 4; i++) {
                            SITE neighbour =
                                GetSiteFromMovement(game, x, y, dirs[i]);
                            if (neighbour.owner != game.playertag &&
                                site.strength > neighbour.strength) {
                                int score =
                                    neighbour.production * 5 - neighbour.strength;
                                if (score > best_score) {
                                    best_score = score;
                                    best_dir = dirs[i];
                                }
                            }
                        }

                        if (best_dir != STILL &&
                            (best_score > 0 || site.strength > 200)) {
                            direction = best_dir;
                        } else {
                            /* Rule 3: move toward nearest border */
                            int min_distance = 999;
                            int min_dir = STILL;
                            for (int i = 0; i < 4; i++) {
                                int dist = 0;
                                int cx = x;
                                int cy = y;
                                SITE neighbour;
                                do {
                                    dist++;
                                    neighbour =
                                        GetSiteFromMovement(game, cx, cy, dirs[i]);
                                    cx = neighbour.x;
                                    cy = neighbour.y;
                                } while (neighbour.owner == game.playertag &&
                                         dist < search_limit);
                                if (neighbour.owner != game.playertag &&
                                    dist < min_distance) {
                                    min_distance = dist;
                                    min_dir = dirs[i];
                                }
                            }
                            if (min_dir != STILL &&
                                site.strength >= build_threshold * 2) {
                                direction = min_dir;
                            } else {
                                direction = STILL;
                            }
                        }
                    }

                    /* Prevent strength overflow */
                    if (direction != STILL) {
                        SITE dest_site =
                            GetSiteFromMovement(game, x, y, direction);
                        if (dest_site.owner == game.playertag &&
                            dest_site.strength + site.strength > 255) {
                            direction = STILL;
                        }
                    }

                    SetMove(game, x, y, direction);
                }
            }

            SendFrame(game);
        }

        return 0;
    }
    ```

    Use this intelligence to inform your strategy. A well-designed bot that accounts for the opponent's tendencies will outperform a fragile exploit. Focus on writing robust, well-tested code first, then incorporate any insights from the opponent's logic as refinements.
