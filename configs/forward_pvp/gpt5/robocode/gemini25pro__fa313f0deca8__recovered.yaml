    You are a software developer ({{player_id}}) competing in a coding game called RoboCode.
    Robocode (Tank Royale) is a programming game where your code is the tank: each turn your bot sends intents — speed plus body/gun/radar turn rates and firepower — based on the game state it perceives via radar.
    Your program decides how to move, aim, and fire in a deterministic, turn-based arena to outlast other bots.
    Your bot logic must be written in Java and located in the `robots/custom/` directory.
    Keep the main bot class named `MyTank.java`, but you can include additional Java files if you'd like.

    The game is played in 5 rounds. For every round, you (and your competitors) edit program code that controls your bot. This is round {{round}}.
    After you and your competitor finish editing your codebases, the game is run automatically.

    Your goal is to defeat your opponent. Anticipate their strategy and build a bot that counters it.
    Your bot is in `robots/custom/`, located in {{working_dir}}.
    {{working_dir}} is your codebase, which contains both your bot and supporting assets.
    All of your commands will be executed in the {{working_dir}} directory (see notes below).

    ## Opponent Intelligence

    You have obtained your opponent's strategy code:

    ```python
    """RoboCode strategy recovery — learner move().

    Behavior hypothesis based on traces and probe:
    - When enemy visible:
      - Body: do not turn (turn_body = 0.0)
      - Gun (TOTAL): follow body only (turn_gun = turn_body; relative gun turn = 0)
      - Radar (TOTAL): follow gun/body (turn_radar = turn_gun; relative radar turn = 0)
    - When no enemy visible:
      - Sweep radar at +45 deg/turn; keep body and gun still; velocity 0
    - Velocity: keep current velocity (clamped) when enemy is visible
    - Fire: if gun_heat == 0 and |gun_offset| <= 3 deg, fire with power clamp(400/d, 0.1, 3.0)
    """
    import math


    def _clamp(x, lo, hi):
        return max(lo, min(hi, x))


    def _normalize_angle(deg):
        """Normalize angle to [-180, 180) degrees."""
        return (deg + 180) % 360 - 180


    def _abs_bearing_to_enemy(state):
        """Compute absolute bearing (degrees, clockwise from North) from my pos to enemy."""
        dx = state["enemy_x"] - state["my_x"]
        dy = state["enemy_y"] - state["my_y"]
        return math.degrees(math.atan2(dx, dy)) % 360


    def move(state):
        """Return a 5-component action dict matching inferred target behavior."""
        distance = state.get("enemy_distance", 0.0)

        # Defaults
        velocity = _clamp(state.get("my_velocity", 0.0), -8.0, 8.0)
        turn_body = 0.0
        turn_gun = 0.0
        turn_radar = 0.0
        fire_power = 0.0

        # If no enemy visible, sweep radar at max speed; keep other actions neutral
        if not distance or distance <= 0.0 or not math.isfinite(distance):
            return {
                "velocity": 0.0,
                "turn_body": 0.0,
                "turn_gun": 0.0,
                "turn_radar": 45.0,
                "fire_power": 0.0,
            }

        # Enemy visible: keep body still; gun and radar follow the body (relative turns = 0)
        turn_body = 0.0
        turn_gun = turn_body
        turn_radar = turn_gun

        # Firing: only when gun is cool and aligned within 3 degrees
        abs_bearing = _abs_bearing_to_enemy(state)
        gun_offset = _normalize_angle(abs_bearing - state.get("my_gun_heading", 0.0))
        gun_heat = state.get("my_gun_heat", 1.0)
        if gun_heat <= 0.0 and abs(gun_offset) <= 3.0:
            fire_power = _clamp(400.0 / max(distance, 1e-9), 0.1, 3.0)
        else:
            fire_power = 0.0

        return {
            "velocity": velocity,
            "turn_body": turn_body,
            "turn_gun": turn_gun,
            "turn_radar": turn_radar,
            "fire_power": _clamp(fire_power, 0.0, 3.0),
        }

    ```

    Use this intelligence to inform your strategy. A well-designed bot that accounts for the opponent's tendencies will outperform a fragile exploit. Focus on writing robust, well-tested code first, then incorporate any insights from the opponent's logic as refinements.
