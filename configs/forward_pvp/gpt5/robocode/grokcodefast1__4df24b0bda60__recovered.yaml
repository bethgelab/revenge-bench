    You have obtained your opponent's strategy code:

    ```python
    """Starter baseline for RoboCode strategy recovery.

    This file is pre-seeded so evaluation works from Round 0.
    Edit the move() function to match the target's behavior.
    """
    import math


    def _clamp(x, lo, hi):
        return max(lo, min(hi, x))


    def _normalize_angle(deg):
        """Normalize angle to [-180, 180) degrees."""
        return (deg + 180) % 360 - 180


    def _abs_bearing_to_enemy(state):
        """Compute absolute bearing (degrees, clockwise from North) from my pos to enemy."""
        dx = state["enemy_x"] - state["my_x"]
        dy = state["enemy_y"] - state["my_y"]
        return math.degrees(math.atan2(dx, dy)) % 360


    def move(state):
        """Given the current game state, return a 5-component action dict.

        Key geometric relationships:
          abs_bearing    = atan2(enemy_x - my_x, enemy_y - my_y)  [clockwise from North]
          gun_offset     = normalize(abs_bearing - my_gun_heading)
          radar_offset   = normalize(abs_bearing - my_radar_heading)
          body_offset    = normalize(abs_bearing - my_heading) = enemy_bearing

        Note: turn_gun and turn_radar are TOTAL deltas and include coupling:
          gun_total   = body_turn + gun_relative
          radar_total = gun_total + radar_relative
        """
        distance = state.get("enemy_distance", 0.0)

        # Zero-energy handling: use a flag to adjust behavior without early return
        zero_energy = state.get("my_energy", 0.0) <= 0.0
        # If no enemy visible: keep radar sweeping at max to search
        if distance <= 0:
            return {
                "velocity": 0.0,
                "turn_body": 0.0,
                "turn_gun": 0.0,
                "turn_radar": 45.0,
                "fire_power": 0.0,
            }

        abs_bearing = _abs_bearing_to_enemy(state)

        # Body: steer toward enemy with small cap (tuned B=3.0)
        body_offset = state["enemy_bearing"]  # already relative to heading
        turn_body = _clamp(body_offset, -2.0, 2.0)

        # At zero energy, freeze body rotation
        if zero_energy:
            turn_body = 0.0

        # Gun: relative turn scaled and clamped (a=0.5, M=10), then add body coupling to get TOTAL
        gun_offset = _normalize_angle(abs_bearing - state["my_gun_heading"])
        gun_rel = _clamp(0.2 * gun_offset, -8.0, 8.0)
        turn_gun_total = turn_body + gun_rel

        # Radar: track gun total (best fit on logs)
        turn_radar_total = turn_gun_total

        # Movement: preserve current speed (target often maintains velocity each tick)
        velocity = state.get("my_velocity", 0.0)


        # Firing: when gun is cool, use inverse-distance rule clamped to [0,3]
        gun_heat = state.get("my_gun_heat", 1.0)
        if zero_energy:
            fire_power = 0.0
        elif gun_heat <= 0 and distance > 0 and abs(gun_offset) <= 1.0:
            fire_power = _clamp(400.0 / distance, 0.0, 3.0)
        else:
            fire_power = 0.0

        return {
            "velocity": _clamp(velocity, -8.0, 8.0),
            "turn_body": _clamp(turn_body, -10.0, 10.0),
            "turn_gun": _clamp(turn_gun_total, -30.0, 30.0),     # total can exceed 20 due to body coupling
            "turn_radar": _clamp(turn_radar_total, -65.0, 65.0), # total can exceed 45 due to coupling
            "fire_power": _clamp(fire_power, 0.0, 3.0),
        }

    ```

