# No-Probe Condition: BattleSnake — DeepSeek v4 Pro
#
# Top 15 targets by ELO rank, 5 rounds, step_limit=30, cost_limit=$1
# Truncation: max_output_chars=3000, keep_recent_observations=8, max_past_output_chars=500, max_context_chars=100000

name: deepseek_v4_pro_no_probe

strategy_pool:
  pool_dir: data/targets/battlesnake
  opponent_pool_dir: data/targets/battlesnake
  fixed_target: false
  seed: 42
  top_elo_targets: 15

tournament:
  seed: 42
  rounds: 5
  type: interventionist
  max_probes_per_round: 0
  sims_per_probe: 3
  opponents_per_round: 20

game:
  name: BattleSnake
  sims_per_round: 20
  args:
    width: 11
    height: 11
    browser: false

players:
  - agent: inverse
    name: learner
    editable: true
    config:
      agent:
        <<: !include prompts/system/interventionist.yaml
        step_limit: 30
        cost_limit: 1.0
        max_output_chars: 3000
        keep_recent_observations: 8
        max_past_output_chars: 500
        max_context_chars: 100000
      model:
        model_name: openrouter/deepseek/deepseek-v4-pro
        cost_tracking: ignore_errors
        model_kwargs:
          timeout: 300
          num_retries: 3
          extra_body:
            provider:
              only: ["DeepSeek"]
  - agent: static
    name: target
    editable: false
    args:
      source_path: data/targets/battlesnake  # overridden by pool

  - agent: static
    name: opponent
    editable: false
    args:
      source_path: data/targets/battlesnake  # overridden per-round by pool

prompts:
  <<: !include prompts/game/no_probe/battlesnake.yaml
