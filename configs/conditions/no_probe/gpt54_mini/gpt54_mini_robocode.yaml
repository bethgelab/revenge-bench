# No-Probe Condition (Full Pool): RoboCode — GPT-5
#
# Top 15 targets by ELO rank, 5 rounds, step_limit=30, cost_limit=$1
# Truncation: max_output_chars=3000, keep_recent_observations=3, max_past_output_chars=500

name: gpt54_mini_no_probe

strategy_pool:
  pool_dir: data/targets/robocode
  opponent_pool_dir: data/targets/robocode
  fixed_target: false
  seed: 42
  top_elo_targets: 15

tournament:
  rounds: 5
  type: interventionist
  max_probes_per_round: 0
  sims_per_probe: 3
  opponents_per_round: 20

game:
  name: RoboCode
  sims_per_round: 20
  record_ratio: 1.0
  args:
    nodisplay: true
    nosound: true

players:
  - agent: inverse
    name: learner
    editable: true
    config:
      agent:
        <<: !include prompts/system/interventionist.yaml
        step_limit: 30
        cost_limit: 1.0
        max_output_chars: 3000
        keep_recent_observations: 8
        max_past_output_chars: 500
        max_context_chars: 100000
      model:
        model_name: openai/gpt-5.4-mini
        cost_tracking: ignore_errors
        model_kwargs:
          api_base: http://localhost:8000/v1
          api_key: dummy

  - agent: static
    name: target
    editable: false
    args:
      source_path: data/targets/robocode  # overridden by pool

  - agent: static
    name: opponent
    editable: false
    args:
      source_path: data/targets/robocode  # overridden per-round by pool

prompts:
  <<: !include prompts/game/no_probe/robocode.yaml
