name: Publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Build distributions
        run: uv build

      - name: Upload distributions
        uses: actions/upload-artifact@v5
        with:
          name: python-distributions
          path: dist/*

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/project/revenge-bench/
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v6
        with:
          name: python-distributions
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.13.0

  github-release:
    needs: [build, publish-pypi]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v6
        with:
          name: python-distributions
          path: dist

      - name: Write release notes
        run: |
          cat > release-notes.md <<EOF
          Python package release for RevengeBench.

          Highlights:
          - Publishes \`revenge-bench\` ${GITHUB_REF_NAME#v} to PyPI: https://pypi.org/project/revenge-bench/${GITHUB_REF_NAME#v}/
          - Provides the \`revenge-bench\` and \`revenge-bench-pool-eval\` console scripts.
          - Includes benchmark configs, target pools, and lightweight scripts in the wheel under \`revenge_bench/assets\`.
          - Source checkouts continue to use the top-level \`configs/\`, \`data/\`, and \`scripts/\` directories.
          - Bundles the vendored CodeClash Python package so PyPI installs do not depend on an unpublished \`codeclash\` package.
          - Excludes Harbor task artifacts from the Python package.

          Install:
          \`\`\`bash
          pip install revenge-bench==${GITHUB_REF_NAME#v}
          \`\`\`
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GH_RELEASE_TOKEN || github.token }}
          name: RevengeBench ${{ github.ref_name }}
          body_path: release-notes.md
          files: dist/*
          fail_on_unmatched_files: true
